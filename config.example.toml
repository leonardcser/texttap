# TextTap Configuration
# Copy to ~/.config/texttap/config.toml to customize

[hotkey]
# Activation mode: "double_tap" or "shortcut"
mode = "double_tap"

# For double_tap mode: The key to double-tap
# Supported: cmd, alt, ctrl, shift, fn (modifiers) or a-z, 0-9, f1-f12, escape, space, etc.
key = "cmd"

# For shortcut mode: Key combination using dash-separated format
# Format: modifier-modifier-key (e.g., "cmd-shift-d", "ctrl-space", "alt-f1")
# Modifiers: cmd, alt, ctrl, shift
# Keys: a-z, 0-9, f1-f12, escape, space, tab, return, delete
shortcut = "cmd-shift-d"

# Max seconds between taps (only for double_tap mode)
double_tap_interval = 0.3

# Examples:
#
# Double-tap Command (default):
#   mode = "double_tap"
#   key = "cmd"
#
# Double-tap Option/Alt key:
#   mode = "double_tap"
#   key = "alt"
#
# Double-tap Fn key:
#   mode = "double_tap"
#   key = "fn"
#
# Shortcut Cmd+Shift+D:
#   mode = "shortcut"
#   shortcut = "cmd-shift-d"
#
# Shortcut Ctrl+Space:
#   mode = "shortcut"
#   shortcut = "ctrl-space"
#
# Shortcut Alt+F1:
#   mode = "shortcut"
#   shortcut = "alt-f1"

[transcription]
# Local transcription is the default. To opt into remote-first transcription,
# set true and configure your own OpenAI-compatible audio transcription API.
# Failed remote requests retry the same recording locally.
remote_enabled = false
# Full HTTPS URL, for example https://stt.example.com/v1/audio/transcriptions
remote_url = ""
# Model identifier accepted by your server.
remote_model = ""
# Remote request budget in seconds per dictation part, including upload and inference.
remote_timeout = 5
# Your credential environment variable name, also used as the Keychain account.
# For example: YOUR_STT_API_KEY. Never put the secret itself here.
# Leave empty only for an endpoint that does not require authentication.
api_key_env = ""
# Local Whisper fallback model, preloaded in the background.
model = "small.en"
# Shared language hint. Use "" for automatic language detection.
language = "en"

[indicator]
enabled = true                # Show waveform indicator near cursor
preview = true                # Show words live while speaking (macOS 26+)
width = 44                    # Indicator width in pixels
height = 18                   # Indicator height in pixels
offset_x = 8                  # Horizontal offset from cursor
offset_y = 0                  # Vertical offset from cursor
bar_count = 9                 # Number of waveform bars
bg_color = "systemBlue"       # Background color (systemBlue, white, #FF0000, etc.)
fg_color = "white"            # Foreground/waveform color
